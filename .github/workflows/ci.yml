name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.7', '24']
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: shop }
        ports: ['33064:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=3s --health-retries=40
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: shop }
        ports: ['33061:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=3s --health-retries=40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node scripts/check-pinned-deps.mjs
      - run: node scripts/check-lifecycle-scripts.mjs
      - run: node scripts/gen-env-docs.mjs --check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build, non-root check, read-only start, health, second-instance refusal, restart on the same volume.
      - run: bash scripts/docker-smoke.sh
      - run: docker build -t dbloom .
      - name: Image size and layers
        run: docker image inspect dbloom --format 'size={{.Size}} layers={{len .RootFS.Layers}}' && docker history dbloom
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: dbloom
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  proxy:
    # FR-SVR-015: Traefik full suite and Caddy subset against the built image; on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:proxy-browser
