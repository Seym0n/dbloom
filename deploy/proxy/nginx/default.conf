# Reference nginx config (SPEC/27 FR-SVR-015). What the app needs from any proxy:
#  - pass the original Host (with port if not default) unchanged
#  - SET X-Forwarded-For to the real peer ($remote_addr), never append to a client-sent value
#  - SET X-Forwarded-Proto to the scheme the client used
#  - cap request bodies and raise the read timeout for imports
server {
    listen 443 ssl;
    server_name dbloom.test evil.example; # evil.example: test only, so the forged-Host test reaches the app
    ssl_certificate     /tmp/test.crt;
    ssl_certificate_key /tmp/test.key;

    client_max_body_size 4m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://172.30.0.2:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
    }
}
