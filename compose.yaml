# Reference deployment (SPEC/27 FR-SVR-013): one instance, one volume, no published port. A reverse proxy (Coolify's
# Traefik) routes to container port 3000. For a local run add compose.local.yaml.
# Nothing is required in .env: without DBLOOM_PUBLIC_ORIGIN and DBLOOM_TRUST_PROXY the app derives the origin from the
# proxy and trusts private-range peers (the exposure report says so). Account mode still needs DBLOOM_PUBLIC_ORIGIN.
services:
  dbloom:
    build: .
    init: false
    expose:
      - '3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - dbloom-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1

volumes:
  dbloom-data:
