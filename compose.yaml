# Reference deployment (SPEC/27 FR-SVR-013): one instance, one volume, no published port. A reverse proxy (Coolify's
# Traefik) routes to container port 3000. For a local run add compose.local.yaml.
services:
  dbloom:
    build: .
    init: false
    expose:
      - '3000'
    env_file:
      - path: .env
        required: false
    environment:
      DBLOOM_PUBLIC_ORIGIN: ${DBLOOM_PUBLIC_ORIGIN:?set DBLOOM_PUBLIC_ORIGIN (https URL) in .env}
      DBLOOM_TRUST_PROXY: ${DBLOOM_TRUST_PROXY:?set DBLOOM_TRUST_PROXY (CIDR of the reverse proxy network) in .env}
    volumes:
      - dbloom-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1

volumes:
  dbloom-data:
